name: CI

on:
  push:
    branches: [main, kartik]
  pull_request:
    branches: [main, kartik]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders only: the build inlines these, and no request is made to them.
      NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api
      API_BASE_URL: https://api.example.invalid/api
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
