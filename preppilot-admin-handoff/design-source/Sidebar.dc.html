<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: {{ w }}; flex: none; box-sizing: border-box; min-height: 900px; height: 100%; background: #FFFFFF; border-right: 1px solid #E5E7EB; padding: 16px 12px; display: flex; flex-direction: column; gap: 24px; color: #1F2937; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; font-size: 14px; line-height: 22px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 {{ padX }}; height: 36px; flex-direction: {{ headDir }}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 24px; height: 24px; border-radius: 6px; background: #0F766E; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"></path></svg></span>
<sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}"><span style="font-size: 16px; line-height: 24px; font-weight: 700">PrepPilot</span></sc-if>
</div>
<sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="Collapse sidebar" aria-expanded="true" onClick="{{ toggle }}" style="width: 28px; height: 28px; border: 0; background: transparent; border-radius: 6px; color: #6B7280; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg></button>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
<a href="{{ it.href }}" aria-label="{{ it.label }}" aria-current="{{ it.current }}" title="{{ it.title }}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; text-decoration: none; justify-content: {{ justify }}; background: {{ it.bg }}; color: {{ it.color }}; font-weight: {{ it.weight }}">
<sc-if value="{{ it.isCand }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14c2 .7 3 2.8 3 6"></path></svg></sc-if>
<sc-if value="{{ it.isRoles }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg></sc-if>
<sc-if value="{{ it.isReports }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M21 20H3"></path></svg></sc-if>
<sc-if value="{{ it.isSettings }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10"></path><path d="M18 6h2"></path><circle cx="16" cy="6" r="2"></circle><path d="M4 12h4"></path><path d="M12 12h8"></path><circle cx="10" cy="12" r="2"></circle><path d="M4 18h10"></path><path d="M18 18h2"></path><circle cx="16" cy="18" r="2"></circle></svg></sc-if>
<sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}"><span>{{ it.label }}</span></sc-if>
</a>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #E5E7EB; padding-top: 12px">
<a href="#" aria-label="Help" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: #1F2937; font-weight: 500; text-decoration: none; justify-content: {{ justify }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2.3-2.4 3.8"></path><path d="M12 17h.01"></path></svg><sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}"><span>Help</span></sc-if></a>
<div style="display: flex; align-items: center; gap: 10px; padding: 8px {{ avatarPad }}; justify-content: {{ justify }}">
<span title="Arjun Mehta" style="width: 32px; height: 32px; border-radius: 999px; background: #CCFBF1; color: #0F766E; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex: none">AM</span>
<sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 14px; line-height: 20px; font-weight: 600">Arjun Mehta</span>
<span style="font-size: 12px; line-height: 16px; color: #6B7280">Recruitment trainer</span>
</div>
</sc-if>
</div>
<sc-if value="{{ collapsedNow }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Expand sidebar" aria-expanded="false" onClick="{{ toggle }}" style="width: 40px; height: 32px; align-self: center; border: 0; background: transparent; border-radius: 6px; color: #6B7280; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path><path d="M13 10l2 2-2 2"></path></svg></button>
</sc-if>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["candidates","roles","reports","settings"],"default":"candidates"},"collapsed":{"editor":"boolean","default":false},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { collapsed: !!(props && props.collapsed) };
}
renderVals() {
var self = this;
var active = this.props.active || 'candidates';
var c = this.state.collapsed;
var NAV = [
{ id: 'candidates', label: 'Candidates', href: 'Candidates.dc.html' },
{ id: 'roles', label: 'Job roles', href: 'JobRoles.dc.html' },
{ id: 'reports', label: 'Reports', href: 'Reports.dc.html' },
{ id: 'settings', label: 'Settings', href: 'Settings.dc.html' }
];
var items = NAV.map(function (n) {
var on = n.id === active;
return {
label: n.label, href: n.href, title: c ? n.label : '',
current: on ? 'page' : 'false',
bg: on ? '#CCFBF1' : 'transparent', color: on ? '#0F766E' : '#1F2937', weight: on ? '600' : '500',
isCand: n.id === 'candidates', isRoles: n.id === 'roles', isReports: n.id === 'reports', isSettings: n.id === 'settings'
};
});
return {
items: items, expanded: !c, collapsedNow: c,
w: c ? '64px' : '240px', padX: c ? '0' : '8px', headDir: 'row',
justify: c ? 'center' : 'flex-start', avatarPad: c ? '0' : '10px',
toggle: function () { self.setState({ collapsed: !self.state.collapsed }); }
};
}
}
</script>
</body>
</html>
