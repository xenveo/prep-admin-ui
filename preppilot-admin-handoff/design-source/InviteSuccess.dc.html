<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invites sent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; min-height: 900px; color: #1F2937; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; font-size: 14px; line-height: 22px">
<dc-import name="Candidates" view="plain" hint-size="100%,900px"></dc-import>
<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
<div role="status" aria-live="polite" style="position: absolute; left: 272px; bottom: 32px; width: 380px; max-width: calc(100% - 32px); box-sizing: border-box; display: flex; align-items: flex-start; gap: 12px; padding: 12px 8px 12px 16px; background: #1F2937; color: #FFFFFF; border-radius: 8px; box-shadow: 0 12px 32px rgba(31, 41, 55, 0.16)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 1px; flex: none"><path d="M5 12l5 5 9-10"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
<span style="font-weight: 600">42 invites sent</span>
<span style="font-size: 12px; line-height: 16px; color: #D1D5DB">Each person gets an email with a login link. 3 rows were skipped.</span>
<a href="#" style="margin-top: 4px; font-size: 13px; font-weight: 600; color: #5EEAD4">Show invite pending</a>
</div>
<button type="button" aria-label="Dismiss" onClick="{{ close }}" style="width: 32px; height: 32px; flex: none; border: 0; border-radius: 6px; background: transparent; color: #D1D5DB; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: true };
}
renderVals() {
var self = this;
return { open: this.state.open, close: function () { self.setState({ open: false }); } };
}
}
</script>
</body>
</html>
